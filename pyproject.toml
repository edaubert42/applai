[project]
name = "applai"
version = "0.0.0"
description = "Agents that prepare job applications while the candidate stays in control."
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.165.0",
    "httpx2>=2.16.2",
    "jsonschema>=4.26.0",
    "mcp>=2.3.0",
    "msal>=1.39.0",
    "pydantic>=2.14.3",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.1.9",
    "uvicorn>=0.54.0",
]

[project.scripts]
applai = "applai.cli:main"

[dependency-groups]
dev = [
    "actionlint-py>=1.7.12.25",
    "pyright",
    "pytest",
    "ruff",
    "types-jsonschema>=4.26.0.20261006",
    "types-pyyaml>=6.0.12.20261113",
    "zizmor>=1.32.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/applai"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests", "tools"]
extraPaths = ["tools"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools"]
addopts = ["--strict-markers"]
