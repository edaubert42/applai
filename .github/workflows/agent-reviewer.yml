# Reviewer agent: reads each new PR with a fresh context and posts one review.
# After the first review it reads only the PR's own commits since its last review, and
# nothing when those are only `Fix CI:` repairs (tools/review_scope.py), whoever pushed them.
name: Agent reviewer

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize, edited]

concurrency:
  group: agent-reviewer-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      !github.event.pull_request.draft
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: What to review since the last review
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          previous=$(gh run list --repo "$REPO" --workflow agent-reviewer.yml --branch "$BRANCH" \
            --event pull_request --status success --limit 20 --json databaseId,headSha \
            | jq -r --argjson id "$RUN_ID" '[.[] | select(.databaseId != $id)][0].headSha // ""')
          mode=$(python3 tools/review_scope.py "$previous" "$HEAD_SHA")
          echo "Review: $mode since ${previous:-the start}."
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
      - if: steps.scope.outputs.mode != 'skip'
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - if: steps.scope.outputs.mode != 'skip'
        uses: anthropics/claude-code-action@e5812cd75691ca7bbfc57c0ecf4441db3a1ab7dd # v1.0.281
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allow_fork_prs: "false"
          # Agent PRs are opened by claude[bot]; forks are refused, so their code is trusted.
          allowed_bots: claude[bot]
          restrict_untrusted_prs: "false"
          # `hard` PRs: Opus at high. Others: Sonnet at medium (reads code, judges, writes no code).
          claude_args: |
            --model ${{ contains(github.event.pull_request.labels.*.name, 'hard') && 'claude-opus-5-5' || 'claude-sonnet-5-5' }}
            --effort ${{ contains(github.event.pull_request.labels.*.name, 'hard') && 'high' || 'medium' }}
            --max-turns 40
            --allowedTools "Read,Glob,Grep,Bash(uv run pytest:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git log:*),Bash(gh issue view:*),Bash(gh pr comment:*),mcp__github_inline_comment__create_inline_comment"
          prompt: |
            You are the reviewer agent of ${{ github.repository }}. Review PR #${{ github.event.pull_request.number }}.
            You did not write it; judge it only by what is in the repository and the linked issue.
            ${{ steps.scope.outputs.mode == 'delta' && format('You reviewed this PR at commit {0}. Review only its commits since: `git log -p --first-parent --no-merges {0}..{1}`. Check that the findings of your last verdict are fixed, and report only findings in those commits: the rest was already accepted.', steps.scope.outputs.previous, github.event.pull_request.head.sha) || 'Review the whole PR.' }}

            Read the diff, the issue it closes, CLAUDE.md and what it points to. Check, in this order:
            1. Spec: every acceptance criterion of the issue is met and covered by a test; nothing outside the issue's scope.
            2. Tests prove something: each test would fail if the behaviour it names broke. Flag tests that check
               a mock, restate the implementation, or replace the database with a fake.
            3. Rules of CLAUDE.md and the ADRs; words from GLOSSARY.md.
            4. Bugs and needless complexity.

            Post an inline comment of at most 3 lines for each finding that blocks a merge, on the line concerned.
            Then post one summary comment with `gh pr comment` that starts with `Verdict: ready to merge` or
            `Verdict: changes needed` (only if a finding blocks), followed by at most 5 lines: the blocking findings,
            most severe first, one line each, and at most one last line marked `non-blocking` for minor points.
            Say nothing about what is fine. Report only findings you can point to in the code.
