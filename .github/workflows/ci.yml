name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: python3 tools/glossary.py
      # The CV renderer prints its PDF with Chromium (applai.cv).
      - run: uv run playwright install --with-deps chromium
      # tests/test_secret_scan.py runs the real gitleaks.
      - run: python3 tools/secret_scan.py install
      - run: uv run pytest
      # Workflows run agents with write access: check their syntax and their security.
      - run: uv run actionlint
      - run: uv run zizmor --offline .github/workflows

  size:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Labels are read live, so after labeling `big-ok` the owner only re-runs this job.
      # HEAD is the PR merged into today's main; HEAD^1 is that main. The event's base sha
      # is not updated when main moves, so it would count PRs merged since.
      - name: Size of the PR, unless the owner labeled it big-ok
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json labels -q '.labels[].name' | grep -qx big-ok; then
            echo "Labeled big-ok: size not checked."
          else
            python3 tools/pr_size.py HEAD^1
          fi

  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # A wrong SHA-256 fails this step, so nothing below runs.
      - run: python3 tools/secret_scan.py install
      # PRs are squash-merged: only the lines the PR adds are scanned, not each commit.
      # gitleaks reads them on stdin, so .gitleaksignore does not apply here: a false positive
      # takes an inline `gitleaks:allow` or an allowlist in a gitleaks config.
      - name: Secrets in the lines the PR adds
        if: github.event_name == 'pull_request'
        run: python3 tools/secret_scan.py pr
      - name: Secrets in each pushed commit
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: python3 tools/secret_scan.py push "$BEFORE" "$AFTER"
      - name: Denylist check on tracked files
        env:
          APPLAI_DENYLIST: ${{ secrets.APPLAI_DENYLIST }}
        run: python3 tools/denylist.py
      - name: Contact details and documents in tracked files
        run: python3 tools/pii.py
