  city: Lyon

# Answers to the questions most forms ask, in French and English.
base_answers:
  pitch:
    fr: Data engineer depuis six ans, je construis des pipelines fiables pour la logistique et l'énergie.
    en: Data engineer for six years, I build reliable pipelines for logistics and energy.
  availability:
    fr: Disponible sous un mois.
    en: Available within one month.
  work_authorization:
    fr: Autorisée à travailler en France sans visa.
